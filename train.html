{% extends "base.html" %}
{% block title %}Train Model{% endblock %}
{% block content %}
<h1>Train Recognition Model</h1>
<p class="subtitle">Run this after registering all students (or whenever you add a new one).</p>

<div class="info-box">
    <button onclick="trainModel()" id="trainBtn">Train Model Now</button>
    <p id="trainStatus" class="status-msg"></p>
</div>

<script>
async function trainModel() {
    const btn = document.getElementById('trainBtn');
    const statusEl = document.getElementById('trainStatus');
    btn.disabled = true;
    statusEl.textContent = "Training in progress...";
    statusEl.className = "status-msg";

    const res = await fetch('/api/train', { method: 'POST' });
    const result = await res.json();

    statusEl.textContent = result.message;
    statusEl.className = result.success ? "status-msg success" : "status-msg error";
    btn.disabled = false;
}
</script>
{% endblock %}
