{% extends "base.html" %}
{% block title %}Take Attendance{% endblock %}
{% block content %}
<h1>Take Attendance (Live)</h1>
<p class="subtitle">Look at the camera. Attendance is marked automatically once your face is recognized.</p>

<div class="camera-box scanning" style="max-width: 500px;">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <p id="recognizeStatus" class="status-msg">Starting camera...</p>
    <button onclick="stopScanning()">Stop</button>
</div>

<div id="log" class="info-box" style="margin-top:20px;">
    <h3>Session Log</h3>
    <ul id="logList"></ul>
</div>

<script>
let stream = null;
let scanning = true;
const markedThisSession = new Set();

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('video').srcObject = stream;
        document.getElementById('recognizeStatus').textContent = "Camera ready. Scanning for faces...";
        scanLoop();
    } catch (err) {
        document.getElementById('recognizeStatus').textContent = "Could not access camera: " + err.message;
        document.getElementById('recognizeStatus').className = "status-msg error";
    }
}

function stopScanning() {
    scanning = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('recognizeStatus').textContent = "Stopped.";
}

async function scanLoop() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('recognizeStatus');
    const logList = document.getElementById('logList');

    while (scanning) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        const imageData = canvas.toDataURL('image/jpeg', 0.8);

        try {
            const res = await fetch('/api/recognize', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image: imageData })
            });
            const result = await res.json();

            if (result.success) {
                statusEl.textContent = `Recognized: ${result.name} (${result.roll_no})`;
                statusEl.className = "status-msg success";

                if (!markedThisSession.has(result.roll_no)) {
                    markedThisSession.add(result.roll_no);
                    const li = document.createElement('li');
                    li.textContent = result.already_marked
                        ? `${result.name} (${result.roll_no}) — already marked present today`
                        : `${result.name} (${result.roll_no}) — marked Present ✓`;
                    logList.prepend(li);
                }
            } else {
                statusEl.textContent = "Looking for a registered face...";
                statusEl.className = "status-msg";
            }
        } catch (err) {
            statusEl.textContent = "Error: " + err.message;
        }

        await new Promise(r => setTimeout(r, 1200));
    }
}

startCamera();
</script>
{% endblock %}
